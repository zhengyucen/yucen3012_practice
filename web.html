<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🇯🇵 日本刷卡與PayPay最佳化推薦</title>
<style>
:root{--primary:#0071e3;--bg:#f5f5f7;--card:#fff;--border:#e5e5ea;--text:#1d1d1f}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);margin:0;color:var(--text);padding:14px}
main{max-width:640px;margin:auto;padding-bottom:50px}
.banner{width:100%;border-radius:16px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.08);background:#fff;margin-bottom:12px;cursor:pointer;position:relative}
.banner img{width:100%;max-height:220px;object-fit:cover;display:block}
.tag{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.65);color:#fff;padding:4px 10px;border-radius:16px;font-size:11px}
.bubble{background:#f0f7ff;border:1px solid #cce5ff;border-radius:12px;padding:12px;font-size:13px;color:#004085;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.talk-btn{background:#fff;border:1px solid #b8daff;color:#0071e3;padding:5px 9px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
h3{font-size:15px;margin:0 0 10px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check-item{display:flex;align-items:center;gap:8px;background:#f9f9fb;padding:10px;border-radius:10px;font-size:13px;border:1px solid var(--border);cursor:pointer}
.check-item input{width:16px;height:16px}
.scene-btn{display:flex;flex-direction:column;padding:10px;background:#f9f9fb;border:1.5px solid var(--border);border-radius:10px;cursor:pointer}
.scene-btn:has(input:checked){background:#fff;border-color:var(--primary)}
.scene-btn input{display:none}
.scene-title{font-size:13px;font-weight:700}
.scene-sub{font-size:11px;color:#888;margin-top:2px}
.cat-title{font-size:11.5px;font-weight:700;color:#888;margin:12px 0 6px}
.btn-grid{display:flex;flex-wrap:wrap;gap:6px}
.shop-btn{border:1px solid var(--border);background:#f9f9fb;border-radius:16px;padding:8px 12px;font-size:13px;cursor:pointer}
.shop-btn.active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important;font-weight:700}
input.amt{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-top:12px;outline:none}
.main-btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#111;color:#fff;cursor:pointer;margin-top:12px}
.res-card{padding:12px;border-radius:12px;background:#f9f9fb;margin-top:10px;border:1px solid var(--border)}
.res-card.best{background:#f0f7ff;border:2px solid var(--primary)}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;background:var(--primary);color:#fff;margin-bottom:4px}
.res-top{display:flex;justify-content:space-between;align-items:baseline}
.rate{font-size:22px;font-weight:800;color:var(--primary)}
.tips{font-size:12px;color:#666;margin-top:4px}
.warn{background:#fff8e6;border:1px solid #ffe199;color:#7a5800;padding:12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<main>

<div class="banner" onclick="nextDialogue()">
  <img src="team.jpg.JPG" alt="陪伴合照" onerror="this.onerror=null;this.src='team.jpg';">
  <div class="tag">點擊換台詞 💬</div>
</div>

<div class="bubble">
  <span id="speech-text">雪乃：「富邦 J 卡在實體店家單筆滿千登錄享最高 6%，大額消費則請留意封頂門檻。」</span>
  <button type="button" class="talk-btn" onclick="nextDialogue()">換一句</button>
</div>

<div class="card">
  <h3>① 我持有的信用卡</h3>
  <div class="grid2">
    <label class="check-item"><input type="checkbox" id="cube" checked onchange="calc()"> 國泰 CUBE 卡</label>
    <label class="check-item"><input type="checkbox" id="kumamon" checked onchange="calc()"> 玉山熊本熊雙幣卡</label>
    <label class="check-item"><input type="checkbox" id="richart" checked onchange="calc()"> 台新 Richart / 玫瑰</label>
    <label class="check-item"><input type="checkbox" id="jfubon" checked onchange="calc()"> 富邦 J 卡</label>
  </div>
</div>

<div class="card">
  <h3>② 支付情境</h3>
  <div class="grid2">
    <label class="scene-btn">
      <input type="radio" name="scene" value="direct_normal" checked onchange="calc()">
      <span class="scene-title">💳 一般直刷</span>
      <span class="scene-sub">實體感應 / 中低額</span>
    </label>
    <label class="scene-btn">
      <input type="radio" name="scene" value="direct_large" onchange="calc()">
      <span class="scene-title">🛍️ 大額直刷</span>
      <span class="scene-sub">電器高單價 / 防封頂</span>
    </label>
    <label class="scene-btn">
      <input type="radio" name="scene" value="paypay_normal" onchange="calc()">
      <span class="scene-title">📱 一般 PayPay</span>
      <span class="scene-sub">小店掃碼 / 玉山・街口</span>
    </label>
    <label class="scene-btn">
      <input type="radio" name="scene" value="paypay_large" onchange="calc()">
      <span class="scene-title">💎 大額 PayPay</span>
      <span class="scene-sub">防點數上限溢出</span>
    </label>
  </div>
</div>

<div class="card">
  <h3>③ 選擇店家 (點擊直接切換)</h3>

  <div class="cat-title">🚇 交通卡專區 (富邦 J 卡 10%)</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn" id="btn-suica" onclick="pick('suica')">Suica / PASMO 加值 (富邦J 10%)</button>
  </div>

  <div class="cat-title">🛒 家電量販 (富邦J實體6% / 熊本熊8.5%)</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn active" id="btn-biccamera" onclick="pick('biccamera')">BicCamera</button>
    <button type="button" class="shop-btn" id="btn-yodobashi" onclick="pick('yodobashi')">友都八喜</button>
    <button type="button" class="shop-btn" id="btn-edion" onclick="pick('edion')">愛電王</button>
  </div>

  <div class="cat-title">💊 藥妝與生活連鎖</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn" id="btn-matsumoto" onclick="pick('matsumoto')">松本清</button>
    <button type="button" class="shop-btn" id="btn-daikoku" onclick="pick('daikoku')">大國藥妝</button>
    <button type="button" class="shop-btn" id="btn-tsuruha" onclick="pick('tsuruha')">鶴羽藥妝</button>
    <button type="button" class="shop-btn" id="btn-donki" onclick="pick('donki')">唐吉訶德</button>
    <button type="button" class="shop-btn" id="btn-conveni" onclick="pick('conveni')">三大便利超商</button>
    <button type="button" class="shop-btn" id="btn-sugi" onclick="pick('sugi')">杉藥局</button>
  </div>

  <div class="cat-title">👕 服飾生活雜貨</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn" id="btn-uniqlo" onclick="pick('uniqlo')">UNIQLO</button>
    <button type="button" class="shop-btn" id="btn-gu" onclick="pick('gu')">GU</button>
    <button type="button" class="shop-btn" id="btn-muji" onclick="pick('muji')">無印良品</button>
    <button type="button" class="shop-btn" id="btn-loft" onclick="pick('loft')">Loft</button>
    <button type="button" class="shop-btn" id="btn-abcmart" onclick="pick('abcmart')">ABC-MART</button>
  </div>

  <div class="cat-title">🎮 潮流與動漫周邊</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn" id="btn-pokemon" onclick="pick('pokemon')">Pokémon Center</button>
    <button type="button" class="shop-btn" id="btn-sanrio" onclick="pick('sanrio')">三麗鷗專賣店</button>
    <button type="button" class="shop-btn" id="btn-kiddyland" onclick="pick('kiddyland')">Kiddy Land</button>
  </div>

  <div class="cat-title">🍜 連鎖美食餐廳</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn" id="btn-ichiran" onclick="pick('ichiran')">一蘭拉麵</button>
    <button type="button" class="shop-btn" id="btn-sushiro" onclick="pick('sushiro')">壽司郎</button>
    <button type="button" class="shop-btn" id="btn-jojoen" onclick="pick('jojoen')">敘敘苑燒肉</button>
    <button type="button" class="shop-btn" id="btn-matsuya" onclick="pick('matsuya')">松屋 / すき家</button>
  </div>

  <div class="cat-title">📍 一般路邊小店 / 攤商</div>
  <div class="btn-grid">
    <button type="button" class="shop-btn" id="btn-other" onclick="pick('other')">一般店家 (無特定加碼)</button>
  </div>

  <input id="amount" class="amt" type="number" placeholder="消費金額 (台幣 NT$，可不填)" oninput="calc()">
  <button type="button" class="main-btn" onclick="calc()">🔍 立即計算最佳回饋</button>
</div>

<div id="out"></div>

</main>
