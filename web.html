<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🇯🇵 日本刷卡與PayPay最佳化推薦</title>
<style>
:root{
  --primary:#0071e3;
  --bg:#f5f5f7;
  --card-bg:#fff;
  --border:#e5e5ea;
  --text:#1d1d1f;
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif;
  background:var(--bg);
  margin:0;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
main{max-width:680px;margin:auto;padding:16px 16px 60px}

/* 頂部合照橫幅 */
.banner-container{
  width:100%;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,0.06);
  border:1px solid rgba(0,0,0,0.05);
  background:#fff;
  margin-bottom:12px;
  cursor:pointer;
  position:relative;
}
.banner-container:active{transform:scale(0.98)}
.banner-img{
  width:100%;
  max-height:240px;
  object-fit:cover;
  display:block;
}
.banner-tag{
  position:absolute;
  bottom:10px;
  right:12px;
  background:rgba(0,0,0,0.65);
  color:#fff;
  backdrop-filter:blur(6px);
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

/* 互動氣泡與換台詞按鈕 */
.speech-box{
  background:#f0f7ff;
  border:1px solid #cce5ff;
  border-radius:14px;
  padding:12px 14px;
  font-size:13.5px;
  color:#004085;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  line-height:1.45;
}
.speech-content{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
}
.change-talk-btn{
  background:#fff;
  border:1px solid #b8daff;
  color:#0071e3;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
}
.change-talk-btn:active{
  background:#0071e3;
  color:#fff;
}

h1{font-size:22px;margin:6px 0 4px;font-weight:700}
.desc{color:#86868
